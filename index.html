<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🍽️ المطعم — حجز المواعيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Reem+Kufi:wght@500;700&family=Amiri:wght@400;700&family=Changa:wght@400;600;800&family=Tajawal:wght@400;500;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1c1b19;--mut:#76716a;--a:#c2410c;--b:#0f766e;--r:16px;--f:'Cairo',system-ui,sans-serif;--h:'Cairo',system-ui,sans-serif;--ln:color-mix(in srgb,var(--ink) 12%,transparent)}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#201f1c;--ink:#f2eee8;--mut:#a39d94}}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f);transition:background .6s,color .6s;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:12px;padding:10px 0}
.logo{font-family:'Lalezar',var(--h);font-size:26px;color:var(--a);white-space:nowrap}
.tabs{margin-inline-start:auto;display:flex;background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:3px}
.tabs button{padding:7px 16px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--a);color:#fff}
.picker{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.pk{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--ln);font-weight:600;font-size:14px;transition:.25s}
.pk.on{background:var(--a);color:#fff;border-color:var(--a);transform:scale(1.05)}
.hero{position:relative;padding:44px 0 30px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 35%,transparent),transparent 70%);filter:blur(10px);transition:.8s}
.hero::after{content:"";position:absolute;inset:auto auto -50% -10%;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--b) 30%,transparent),transparent 70%);transition:.8s}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center}
h1{font-family:var(--h);font-size:clamp(34px,6vw,64px);line-height:1.15;font-weight:800}
.sub{color:var(--mut);font-size:18px;margin-top:12px;max-width:34em}
.big{font-size:min(38vw,190px);text-align:center;filter:drop-shadow(0 20px 30px color-mix(in srgb,var(--a) 40%,transparent));animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px) rotate(-4deg)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;padding-bottom:60px;align-items:start}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:20px;transition:background .6s}
.sec{margin-bottom:22px}
.sec h3{font-family:var(--h);font-size:19px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h3 i{font-style:normal;background:var(--a);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.op{text-align:start;padding:12px 14px;border:1.5px solid var(--ln);border-radius:calc(var(--r) * .7);background:var(--bg);transition:.2s}
.op b{display:block;font-size:15px}.op small{color:var(--mut)}
.op:hover{border-color:var(--a)}
.op.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.dy{flex:none;width:62px;padding:10px 0;text-align:center;border:1.5px solid var(--ln);border-radius:calc(var(--r) * .7);background:var(--bg)}
.dy b{display:block;font-size:20px}.dy small{color:var(--mut);font-size:12px}
.dy.on{background:var(--a);color:#fff;border-color:var(--a)}.dy.on small{color:#fff}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin-top:10px}
.sl{padding:9px 0;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);font-weight:600;font-size:14px;direction:ltr}
.sl.on{background:var(--b);color:#fff;border-color:var(--b)}
.sl:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,textarea{width:100%;padding:11px 13px;border-radius:calc(var(--r) * .6);border:1.5px solid var(--ln);background:var(--bg)}
input:focus,textarea:focus{outline:none;border-color:var(--a)}
.err{border-color:#dc2626!important}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--ln);border-radius:calc(var(--r) * .6);padding:6px}
.step button{width:40px;height:40px;border-radius:50%;background:var(--a);color:#fff;font-size:22px}
.step span{font-size:22px;font-weight:800}
.go{width:100%;padding:15px;border-radius:calc(var(--r) * .8);background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:800;font-size:17px;margin-top:6px;transition:transform .2s}
.go:hover{transform:translateY(-2px)}
.tk{position:sticky;top:calc(130px + env(safe-area-inset-top,0px));border-style:dashed;border-width:2px}
.tk h4{font-family:var(--h);font-size:20px;margin-bottom:10px}
.tk .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--ln);font-size:14px;gap:10px}
.tk .row span:first-child{color:var(--mut)}
.tot{font-size:26px;font-weight:900;color:var(--a);margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0 16px}
.st{padding:16px}.st small{color:var(--mut)}.st b{display:block;font-size:32px;font-family:var(--h);color:var(--a)}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:10px}
.bar{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.bar i{display:block;background:linear-gradient(var(--a),var(--b));border-radius:8px 8px 3px 3px;min-height:4px;transition:height .6s;margin-bottom:4px}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.fl button{padding:6px 14px;border-radius:99px;border:1.5px solid var(--ln);font-size:13px;font-weight:600}
.fl button.on{background:var(--ink);color:var(--bg)}
.bk{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px;margin-bottom:10px;align-items:center}
.bk h5{font-size:16px}.bk p{color:var(--mut);font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-inline-start:6px;color:#fff}
.s-new{background:#2563eb}.s-ok{background:#16a34a}.s-done{background:#64748b}.s-x{background:#dc2626}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts button,.acts a{padding:6px 11px;border-radius:8px;border:1.5px solid var(--ln);font-size:13px;text-decoration:none;color:var(--ink)}
.empty{text-align:center;padding:40px;color:var(--mut)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50;padding:16px}
.mod.on{display:grid}
.mod .card{max-width:400px;width:100%;text-align:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.ok{font-size:64px}.code{font-family:var(--h);font-size:30px;letter-spacing:3px;color:var(--a);margin:8px 0;direction:ltr}
.cf{position:fixed;top:-30px;font-size:26px;z-index:60;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.hide{display:none!important}
@media(max-width:800px){.hero .wrap,.grid{grid-template-columns:1fr}.big{font-size:90px;order:-1}.tk{position:static}.hero{padding:20px 0}.bk{grid-template-columns:1fr}.acts{justify-content:flex-start}}
.card{box-shadow:0 1px 2px rgba(0,0,0,.05),0 18px 40px -18px color-mix(in srgb,var(--a) 45%,transparent)}
header{box-shadow:0 8px 30px -20px var(--a)}header::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--a),var(--b),var(--a));background-size:200%;animation:gl 6s linear infinite}
@keyframes gl{to{background-position:200%}}
.hero::before{animation:dr 12s ease-in-out infinite alternate}.hero::after{animation:dr 15s ease-in-out infinite alternate-reverse}
@keyframes dr{to{transform:translate(-50px,40px) scale(1.18)}}
#sv .op{animation:up .55s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--n,0)*70ms)}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.94)}}
.op{box-shadow:0 2px 0 var(--ln)}.op:hover{transform:translateY(-3px);box-shadow:0 14px 24px -12px var(--a)}
.op.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 25%,transparent),0 14px 28px -12px var(--a)}
.dy,.sl{transition:.2s}.dy:hover,.sl:hover:not(:disabled){transform:translateY(-2px);border-color:var(--a)}
.dy.on,.sl.on{box-shadow:0 10px 20px -8px var(--a)}
.go{position:relative;overflow:hidden;box-shadow:0 14px 30px -10px var(--a)}.go:active{transform:scale(.98)}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-120%);animation:sh 3.2s infinite}
@keyframes sh{to{transform:translateX(120%)}}
.pk{box-shadow:0 4px 12px -8px var(--a)}.pk.on{box-shadow:0 10px 20px -6px var(--a)}
.st{transition:.25s}.st:hover{transform:translateY(-4px)}
.mod{backdrop-filter:blur(6px)}.mod .card{box-shadow:0 30px 80px -20px var(--a)}
.ed{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.ed.hd small{color:var(--mut)}.del{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--ln)}.del:hover{background:#dc2626}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:12px}
input[type=color]{padding:3px;height:46px;cursor:pointer}input[type=range]{padding:0;accent-color:var(--a)}
.note{color:var(--mut);font-size:13px;margin-top:10px}
select{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}
#px h3{font-family:var(--h)}
.lgb{padding:7px 13px;border-radius:99px;border:1.5px solid var(--a);font-weight:800;font-size:13px;background:var(--card);color:var(--a);box-shadow:0 6px 14px -8px var(--a)}
[dir=ltr] #ph{text-align:left!important}
.hero{padding:14px 0 6px!important}.sub,.chips{display:none}h1{font-size:clamp(24px,4vw,38px)}.big{font-size:70px!important}.hero .wrap{grid-template-columns:1fr auto!important}
@media(max-width:800px){.ed{grid-template-columns:1fr 1fr}.ed input:first-child{grid-column:1/-1}.ed.hd{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tk{top:calc(76px + env(safe-area-inset-top,0px))}</style>
</head>
<body>
<header><div class="wrap">
<div class="top"><div class="logo">🍽️ المطعم</div>
<div class="tabs"><button id="tb" class="on">➕ حجز جديد</button><button id="td">📊 الحجوزات والإدارة</button></div><button id="lsw" class="lgb" aria-label="Language">EN</button></div>
<div class="picker" id="pk" style="display:none"></div>
</div></header>

<main id="vb">
<section class="hero"><div class="wrap"><div><h1 id="ht"></h1><p class="sub" id="hs"></p><div class="chips" id="hc"></div></div><div class="big" id="he"></div></div></section>
<div class="wrap grid">
<div class="card">
<div class="sec"><h3><i>1</i><span id="l1"></span></h3><div class="opts" id="sv"></div></div>
<div class="sec hide" id="ss"><h3><i id="ns">2</i><span id="ls"></span></h3><div class="opts" id="sb"></div></div>
<div class="sec hide" id="xs"><h3><i>2</i><span id="l2"></span></h3><div id="xb"></div></div>
<div class="sec"><h3><i id="n3">2</i><span>اختار اليوم والميعاد</span></h3><div class="days" id="dy"></div><div style="margin-top:12px"><label for="dp">📅 عايز تاريخ أبعد؟ اختاره من التقويم</label><input type="date" id="dp" style="max-width:260px" onchange="if(this.value){S.d=this.value;S.t=null;days();slots();tick()}"></div><div class="slots" id="sl"></div></div>
<div class="sec"><h3><i id="n4">3</i><span>بيانات العميل</span></h3>
<div class="f"><div><label for="nm">الاسم</label><input id="nm" autocomplete="name" placeholder="اسم العميل"></div>
<div><label for="ph">رقم الموبايل</label><input id="ph" type="tel" inputmode="tel" oninput="known()" dir="ltr" style="text-align:right" placeholder="01xxxxxxxxx"></div>
<div class="full note" id="ph2" style="margin:0"></div><div class="full"><label for="nt">ملاحظات (اختياري)</label><textarea id="nt" rows="2" placeholder="أي تفصيلة عايزنا نعرفها"></textarea></div></div></div>
<button class="go" id="go">تأكيد الحجز</button>
</div>
<aside class="card tk"><h4 id="th"></h4><div id="tr"></div><div class="tot" id="tt"></div></aside>
</div>
</main>

<main id="vd" class="hide"><div class="wrap" style="padding-bottom:60px">
<h2 id="dh" style="font-family:var(--h);margin-top:24px"></h2>
<div class="fl" id="dn"></div><div id="px" class="hide"></div><div id="pbk">
<div class="stats" id="ds"></div>
<div class="card"><b>الحجوزات آخر ٧ أيام قدام</b><div class="bars" id="db"></div></div>
<input id="sq" oninput="dash()" placeholder="🔍 دوّر بالاسم أو رقم الموبايل" style="margin-top:16px"><div class="fl" id="df"></div>
<div id="dl"></div>
<div class="acts" style="margin-top:14px"><button id="ex">⬇ تصدير CSV</button><button id="rs">🗑 مسح الحجوزات</button></div></div>
</div></main>

<div class="mod" id="lg"><div class="card"><div class="ok">🔐</div><h3 style="font-family:var(--h)">دخول الإدارة</h3><input id="pw" type="password" placeholder="كلمة السر" style="margin:14px 0 6px" autocomplete="current-password"><p id="pe" style="color:#dc2626;min-height:22px;font-size:14px"></p><div class="acts" style="justify-content:center"><button id="lo">دخول</button><button id="lc">إلغاء</button></div></div></div>
<div class="mod" id="md"><div class="card"><div class="ok">🎉</div><h3 style="font-family:var(--h)">تم الحجز بنجاح</h3><div class="code" id="cd"></div><p id="mt" style="color:var(--mut);line-height:1.8"></p><div class="acts" style="justify-content:center;margin-top:14px"><a id="wa" target="_blank" rel="noopener">📲 ابعت تأكيد للعميل</a><button id="mc">تمام</button></div></div></div>
